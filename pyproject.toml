[project]
name = "transit-mcp"
version = "0.1.0"
description = "Scrape and serve public-transit rider information (WMATA / DC Metro first) to an LLM over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.6,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "tzdata>=2024.1",  # time zones inside slim containers
    "gtfs-realtime-bindings>=1.0",  # agencies' GTFS-realtime service alerts
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[project.scripts]
transit-mcp = "transit_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip(..., strict=) — many intentional ragged zips here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/transit_mcp/ingest/gtfs/fare_pages.py" = ["E501"]  # long registry URLs
