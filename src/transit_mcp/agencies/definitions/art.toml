slug = "art"
name = "Arlington Transit (ART)"
mode = "bus"

[profile]
role = """\
  Arlington's local bus, connecting neighborhoods to Metrorail stations and covering \
  the gaps between the Orange/Silver and Blue/Yellow corridors where Metrobus does \
  not go."""
strengths = """\
  Frequent core routes (41, 42, 43, 45, 55, 87); fills local coverage Metro misses; \
  ties into every Arlington Metro station and the Shirlington and Pentagon City bus \
  hubs."""
weaknesses = "Smaller network; several routes are peak-only; limited late-night service."
service_area = "Arlington County."
connects_to = [
  "Ballston-MU, Virginia Square, Clarendon, Court House (Orange/Silver)",
  "Rosslyn (Orange/Silver/Blue)",
  "Pentagon City, Crystal City (Blue/Yellow)",
  "East Falls Church (Orange/Silver)",
  "Shirlington bus hub",
]
frequency_tier = "frequent"

[fares]
base_fare = 2.25
reduced_fare = 1.10
payment_methods = [
  "SmarTrip card or SmarTrip in Apple/Google Wallet",
  "Exact-change cash in the farebox",
]
where_to_buy = [
  "Use an existing SmarTrip or buy/reload one at any Metrorail station, online, or at retail",
]
accepts_smartrip = true
cash_onboard = true
exact_change_required = true
transfer_policy = """\
  SmarTrip only: free transfers to ART or Metrobus within 2 hours, and a discount on \
  Metrorail within 2 hours ($2.25 adults, $1.10 seniors)."""
fare_page_url = "https://www.arlingtontransit.com/rider-info-fares/fares/"
notes = """\
  $2.25 adults, $1.10 seniors 65+ (Senior SmarTrip or Medicare card). 7-Day Regional \
  Bus Pass $13.50 adults, $6.75 seniors. Free for people with a Metro Disability ID, \
  MetroAccess customers and their attendants, and children under 5. K-12 students: \
  free with iRide SmarTrip, $1.10 cash with school ID. Cash: $1, $2, $5, $10 bills \
  and coins; no change given. STAR paratransit: Zone 1 $4.50, Zone 2 $6.20, Zone 3 \
  $10.70. MICRO: $3.00 a ride, $2.00 seniors, disabled riders and K-12 students, \
  $2.00 each additional passenger, children under 5 free. Fares change; confirm the \
  current amount at the fare page before you travel."""

