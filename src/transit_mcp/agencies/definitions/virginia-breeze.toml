slug = "virginia-breeze"
name = "Virginia Breeze"
mode = "intercity_bus"

[profile]
role = """\
  State-sponsored intercity coach (DRPT) with five routes linking southwest, \
  central, and Shenandoah Valley Virginia to Northern Virginia and DC — Valley \
  Flyer, Piedmont Express, Capital Connector, Highlands Rhythm, and Star City \
  Express."""
strengths = """\
  Reaches cities with no other transit link to DC (Blacksburg, Roanoke, Lynchburg, \
  Harrisonburg, Bristol, Martinsville); comfortable coach with Wi-Fi and restroom; \
  stops at West Falls Church Metro, Dulles Airport, Rosslyn, and Union Station."""
weaknesses = """\
  One round trip per route per day; long-distance only (not a local option); advance \
  online booking strongly recommended and seats sell out."""
service_area = """\
  Corridors from SW/central/Valley Virginia to Dulles, Falls Church, Arlington, and \
  DC."""
connects_to = [
  "West Falls Church (Metro Orange)",
  "Dulles International Airport (Metro Silver via the airport station)",
  "Rosslyn (Orange/Silver/Blue)",
  "Union Station DC (Metro Red, Amtrak, MARC, VRE)",
]
frequency_tier = "intercity"
park_and_ride = true

[fares]
payment_methods = [
  "Buy online before you travel",
]
where_to_buy = [
  "https://virginiabreeze.tds.ai/#/",
]
transfer_policy = """\
  No integrated transfers: a Breeze ticket covers only the coach. Buy Metro fare \
  separately at your connecting station."""
fare_page_url = "https://virginiabreeze.tds.ai/#/"
notes = """\
  Fares vary by route and date, so there is no set fare chart: buy tickets ahead at \
  https://virginiabreeze.tds.ai/#/ . One carry-on and one checked bag are included. \
  Arrive about 15 minutes before departure."""

