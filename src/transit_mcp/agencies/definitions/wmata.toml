slug = "wmata"
name = "Metrorail (WMATA)"
mode = "rail"

[profile]
display_name = "Metrorail (WMATA)"
role = """\
  The regional rapid-transit backbone: six grade-separated rail lines plus a dense \
  bus network across DC, Arlington, Alexandria, and inner \
  Fairfax/Montgomery/Prince George's."""
strengths = """\
  Highest frequency and span in the region; rail is unaffected by road traffic; one \
  payment method works system-wide and on most local bus partners; runs until \
  ~midnight (later Fri/Sat)."""
weaknesses = """\
  Does not reach the outer exurbs (Loudoun west, Prince William, Fredericksburg, \
  western Fairfax); rail disruptions cascade; some bus routes are infrequent off-peak."""
service_area = """\
  Washington DC; Arlington, Alexandria, Fairfax, Falls Church, Montgomery MD, \
  Prince George's MD."""
connects_to = ["itself — the hub every other system feeds"]
frequency_tier = "frequent"
park_and_ride = true

[fares]
base_fare = 2.25
reduced_fare = 1.10
payment_methods = [
  "SmarTrip card",
  "SmarTrip in Apple Wallet / Google Wallet",
  "Contactless bank card or phone (tap to pay)",
  "No cash at the faregates — buy or load a SmarTrip at a station machine",
]
where_to_buy = [
  "Fare vending machines in every Metrorail station",
  "Add a SmarTrip in the SmarTrip app (iOS/Android) or Apple/Google Wallet",
  "wmata.com and CVS / Giant / Safeway and commuter stores",
]
mobile_app_name = "SmarTrip"
accepts_smartrip = true
accepts_contactless = true
cash_onboard = false
exact_change_required = false
# Hand-written summary of wmata.com/pay.html; the tools also return the fare page's
# own text, which wins if they differ.
transfer_policy = """\
  Changing trains is free (one continuous trip). Bus-to-rail and rail-to-bus \
  transfers within 2 hours get a discount when paying with SmarTrip or contactless \
  — see the fare page for the amount."""
fare_page_url = "https://www.wmata.com/pay.html"
notes = """\
  Metrorail fares depend on distance and on the day and time of travel; the exact \
  station-to-station fare comes from WMATA's fare data. Confirm on the fare page."""

# What riders call stations when it isn't the official name. Matching is
# case-insensitive. (Without these, "National Airport" would match "Washington
# Dulles International Airport".)
[aliases]
"DCA" = "C10"
"Reagan" = "C10"
"Reagan Airport" = "C10"
"Reagan National" = "C10"
"Reagan National Airport" = "C10"
"National Airport" = "C10"
"Washington National Airport" = "C10"
"IAD" = "N10"
"Dulles" = "N10"
"Dulles Airport" = "N10"
"Dulles International" = "N10"
"Dulles International Airport" = "N10"
# Neighbourhood names riders use for the station that serves them.
"Old Town" = "C13"
"Old Town Alexandria" = "C13"
"Tysons Corner" = "N02"
"Nationals Park" = "F05"

# Real-time incidents, stations, lines, parking, entrances, station-to-station fares,
# and the order of stations along each Metrorail line (from WMATA's rail GTFS).
# Metrorail routes, station order and schedules: WMATA's rail GTFS via Transitland.
# Stations are matched by WMATA station code (GTFS parent stations STN_<code>), so
# the GTFS stops themselves are not indexed for place search.
[[sources]]
type = "gtfs"
transitland_id = "f-dqc-wmata~rail"
url = "https://api.wmata.com/gtfs/rail-gtfs-static.zip"
auth_env = "WMATA_API_KEY"
index_stops = false
metrorail_line_order = true

# Station details (entrances, parking), live incidents, elevator outages, and the
# station-to-station fare matrix. Nothing route- or schedule-related.
[[sources]]
type = "wmata_api"
include_fares = true

# Rider-guidance pages on wmata.com. A curated allow-list, not an open crawl: hub
# pages (follow_children = true) fan out one hop to child pages under child_prefixes.
[[sources]]
type = "web_pages"
base_url = "https://www.wmata.com"
max_pages = 60
child_suffix = ".html"
# Localized mirrors of every page live under these first path segments.
skip_path_segments = ["am", "ar", "es", "fa", "fil", "fr", "ko", "pt-br", "ru", "so", "vi", "zh-hans", "zh-hant"]
child_prefixes = [
  "/ride/guides/",
  "/ride/alerts-and-advisories/",
  "/ride/elevators-escalators/",
  "/ride/accessibility/",
  "/initiatives/safety-and-security/",
  "/pay/",
]
child_blocklist = [
  "/ride/guides/airports-and-train-stations.html",  # describes routes: GTFS only
  "/news/employee-alerts.html",
  "/ride/metroalerts.html",
  "/initiatives/safety-and-security/es.html",
]
# Category for discovered child pages, first matching prefix wins.
child_categories = [
  { prefix = "/pay/fare-programs", category = "fares" },
  { prefix = "/pay/", category = "payment" },
  { prefix = "/ride/alerts-and-advisories/", category = "alerts" },
  { prefix = "/ride/elevators-escalators/", category = "accessibility" },
  { prefix = "/ride/accessibility/", category = "accessibility" },
  { prefix = "/initiatives/safety-and-security/", category = "safety" },
  { prefix = "/ride/guides/visitors", category = "visitor" },
  { prefix = "/ride/guides/", category = "new_rider" },
]
pages = [
  { url = "/ride/alerts-and-advisories.html", category = "alerts", follow_children = true },
  { url = "/pay.html", category = "fares", follow_children = true },
  { url = "/pay/smart-trip.html", category = "payment" },
  { url = "/pay/tap-ride-go.html", category = "payment" },
  { url = "/pay/fare-programs.html", category = "fares" },
  { url = "/ride/accessibility.html", category = "accessibility", follow_children = true },
  { url = "/ride/accessibility/metro-access.html", category = "accessibility" },
  { url = "/ride/elevators-escalators.html", category = "accessibility", follow_children = true },
  { url = "/ride/guides.html", category = "new_rider", follow_children = true },
  { url = "/ride/guides/new-riders.html", category = "new_rider" },
  { url = "/ride/guides/visitors.html", category = "visitor" },
  { url = "/initiatives/safety-and-security.html", category = "safety", follow_children = true },
  { url = "/about/metro-transit-police-department.html", category = "safety" },
  { url = "/about/metro-transit-police-department/contact-us.html", category = "safety" },
]
