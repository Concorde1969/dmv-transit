slug = "potomac-valley"
name = "Potomac Valley Transit Authority"
mode = "bus"

# Added from the Transitland feed list. Descriptions and fares are intentionally left
# out: answers about this agency come from its GTFS feed (routes, stops, schedules;
# fare page from the feed's agency.txt) until a curated profile is written.
[profile]
frequency_tier = "infrequent"

[fares]
mobile_app_name = "Token Transit"
fare_page_url = "https://www.potomacvalleytransit.org/fares-passes/"
notes = """\
  READY RIDE fares are $2.00 a boarding. For Regular Route fares, call 304-257-1414 \
  or 1-800-565-7240. Regular Route: 50% off for seniors 62+ and people with \
  disabilities. Children 6 to 12: 50% off all fares; under 6 free. Discount pass: \
  $5.50 of Regular Route service for $5.00. Fares change; confirm the current amount \
  at the fare page before you travel."""

