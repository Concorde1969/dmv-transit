slug = "mta-md-commuter-bus"
name = "MTA Maryland Commuter Bus"
mode = "commuter_bus"

# Added from the Transitland feed list. Descriptions and fares are intentionally left
# out: answers about this agency come from its GTFS feed (routes, stops, schedules;
# fare page from the feed's agency.txt) until a curated profile is written.
[profile]
frequency_tier = "peak"

[fares]
payment_methods = [
  "CharmPass mobile app",
  "Paper tickets from Commuter Direct",
  "10-trip and monthly tickets at MARC ticket machines",
]
mobile_app_name = "CharmPass"
fare_page_url = "https://www.mta.maryland.gov/commuterbus-fares"
notes = """\
  Fares go by zone, shown on each route's PDF schedule. One way: Zone 1 $4.00, 2 \
  $5.00, 3 $6.00, 4 $7.00, 5 $8.00 (senior or disability $3.00 to $7.00). 10 Trip: \
  $40.00 to $80.00 ($30.00 to $70.00). Monthly: $136.00 to $272.00 ($102.00 to \
  $238.00). A Transit Link Card adds $34 a month. Fares change; confirm the current \
  amount at the fare page before you travel."""

# Routes, stops and schedules: GTFS found through Transitland (url = fallback).
[[sources]]
type = "gtfs"
transitland_id = "f-dq-mtamaryland~commuterbus"
# Live departures: Transitland merges this GTFS-realtime feed into departures.
transitland_rt_id = "f-dq-mtamaryland~commuterbus~rt"
transitland_atlas = "mta.maryland.gov.dmfr.json"
url = "https://feeds.mta.maryland.gov/gtfs/commuter-bus"

# Fare page: the fields above are a summary of it.
[[sources]]
type = "web_pages"
pages = [
  { url = "https://www.mta.maryland.gov/commuterbus-fares", category = "fares" },
]
