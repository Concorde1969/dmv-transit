slug = "fairfax-connector"
name = "Fairfax Connector"
mode = "bus"

[profile]
role = """\
  Fairfax County's bus network and the main Metrorail feeder for the county — \
  Silver Line in Reston/Herndon/Tysons, Orange Line at Vienna, Blue Line at \
  Franconia-Springfield, Yellow at Huntington."""
strengths = """\
  Broadest suburban coverage in Northern Virginia; many timed Metro-station feeders; \
  some frequent trunk routes in Reston and Tysons; connects to Dulles Airport."""
weaknesses = """\
  Many routes are peak-only or run every 30–60 min; weekend service is thin or \
  absent on lower-ridership routes."""
service_area = "Fairfax County, Reston, Herndon, Tysons, Vienna, Springfield, Huntington, McLean."
connects_to = [
  "Wiehle-Reston East, Reston Town Center, Herndon, Innovation Center (Silver)",
  "Spring Hill, Greensboro, Tysons, McLean (Silver)",
  "Vienna/Fairfax-GMU (Orange)",
  "Franconia-Springfield (Blue, VRE, OmniRide)",
  "Huntington (Yellow)",
  "Pentagon (peak express routes)",
]
frequency_tier = "peak"
park_and_ride = true

[fares]
base_fare = 2.25
reduced_fare = 1.10
payment_methods = [
  "SmarTrip card or SmarTrip in Apple/Google Wallet",
  "Exact-change cash in the farebox",
]
where_to_buy = [
  "Use an existing SmarTrip, or buy one at any Metrorail station machine, online, or at retail",
  "No ticket needed: tap or pay cash when boarding",
]
accepts_smartrip = true
cash_onboard = true
exact_change_required = true
transfer_policy = """\
  With SmarTrip, local bus-to-bus transfers are free for 2 hours; a transfer from a \
  Regular Route to an Express Route may cost more. Metrorail-to-bus with SmarTrip: \
  Regular Routes free; routes 393, 394, 395, 396, 599, 697, 698, 699 and 835 cost \
  $2.55 ($0.15 seniors and people with disabilities)."""
fare_page_url = "https://www.fairfaxcounty.gov/connector/fares-and-policies"
notes = """\
  Regular Routes $2.25, $1.10 seniors and people with disabilities. Routes 393, 394, \
  395, 396, 599, 697, 698, 699 and 835: $4.80 ($2.40). Routes 350 (TAGS), 423 and \
  427: $0.55. 480 Wolf Trap Express: $5.00 round trip ($2.75 after Metrorail with \
  SmarTrip). Children 12 and under ride free with a paying adult. Fares change; \
  confirm the current amount at the fare page before you travel."""

