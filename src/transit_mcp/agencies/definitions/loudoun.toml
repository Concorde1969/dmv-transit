slug = "loudoun"
name = "Loudoun County Transit"
mode = "bus"

[profile]
role = """\
  Weekday commuter buses from Loudoun park-and-ride lots to DC, the Pentagon, and \
  Rosslyn, plus Silver Line connector routes to Ashburn, Loudoun Gateway, and \
  Innovation Center, plus a few local routes in eastern Loudoun."""
strengths = """\
  Express commuter service that skips the Dulles Toll Road and I-66/I-495 backups; \
  very large park-and-ride lots; Silver Line connectors give western Loudoun a rail \
  option."""
weaknesses = """\
  Commuter routes are weekday peak-only and peak-direction; local route coverage and \
  frequency are limited; almost nothing runs midday, evening, or weekends."""
service_area = "Loudoun County — Ashburn, Leesburg, Purcellville, Sterling, South Riding, Dulles."
connects_to = [
  "Ashburn, Loudoun Gateway, Innovation Center (Metro Silver)",
  "Rosslyn (Orange/Silver/Blue)",
  "Pentagon (Blue/Yellow)",
  "L'Enfant Plaza, Downtown DC (peak express)",
]
frequency_tier = "peak"
park_and_ride = true

[fares]
payment_methods = [
  "SmarTrip card (required on Commuter and Metro Connection buses)",
  "Exact-change cash on Local routes",
]
where_to_buy = [
  "Load value on a SmarTrip before boarding a commuter bus — buy/reload at any Metrorail station, online, or at retail",
]
accepts_smartrip = true
cash_onboard = true
exact_change_required = true
transfer_policy = """\
  SmarTrip gives transfer discounts to Metrorail/Metrobus; the Metro Connection \
  routes are timed to Silver Line trains."""
fare_page_url = "https://www.loudoun.gov/2472/Fares"
notes = """\
  Commuter routes to DC/Pentagon run roughly $8–$12.50 one way; Metro Connection and \
  Local routes are much cheaper ($1–$2). SmarTrip is required on the commuter buses. \
  Fares change; confirm the current amount at the fare page before you travel."""

