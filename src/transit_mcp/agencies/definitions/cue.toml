slug = "cue"
name = "CUE Bus (City of Fairfax)"
mode = "bus"

[profile]
role = """\
  A small four-route local system (Gold 1/2, Green 1/2) circulating the City of \
  Fairfax and George Mason University with a direct link to Vienna/Fairfax-GMU Metro \
  on the Orange Line."""
strengths = """\
  Cheap and simple; the fastest transit link between GMU and the Orange Line; \
  frequent on weekdays; free for every rider."""
weaknesses = """\
  Tiny service area (City of Fairfax + GMU); reduced weekend frequency; no \
  late-night service."""
service_area = "City of Fairfax and George Mason University."
connects_to = [
  "Vienna/Fairfax-GMU (Metro Orange)",
  "George Mason University",
  "Fairfax Connector routes in Old Town Fairfax",
]
frequency_tier = "frequent"

[fares]
base_fare = 0.00
reduced_fare = 0.00
payment_methods = [
  "No fare: CUE is free and no ID is required. Just board.",
]
where_to_buy = [
  "Nothing to buy.",
]
transfer_policy = """\
  No fare, so transfers are irrelevant: board and ride."""
fare_page_url = "https://www.fairfaxva.gov/Services/CUE-Bus"
notes = """\
  CUE fares are free and no ID is required. Lost and found: items are held for 30 \
  days; call (703) 385-7859, email CUE@fairfaxva.gov, or visit 3410 Pickett Rd, \
  Fairfax. City Wheels, for City of Fairfax residents with disabilities, costs $3.20 \
  a ride: 703-385-7810."""

