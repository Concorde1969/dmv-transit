# Holiday markets and seasonal events, curated by hand from each organizer's own page.
#
# One [[event]] each. Dates are local (America/New_York). `hours` lists the days of the
# week it's open and when; with `start`, `end` and `closed` that gives every open day.
# `getting_there` is only what the organizer's page itself says about transit; the trip
# itself always comes from the planner. Keep `source` and `checked` with every entry,
# and drop past events whenever convenient (they stop showing the day after `end`).

[[event]]
id = "downtown-dc-holiday-market"
name = "DowntownDC Holiday Market"
kind = "market"
