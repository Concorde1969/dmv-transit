address = "F St NW between 7th and 9th Streets NW, Washington, DC"
at = [38.89711, -77.02329]
start = 2026-11-13
end = 2026-12-23
closed = [2026-11-26]
hours = [
  { days = ["mon", "tue", "wed", "thu"], open = "12:00", close = "20:00" },
  { days = ["fri", "sat"], open = "11:00", close = "21:00" },
  { days = ["sun"], open = "11:00", close = "20:00" },
]
