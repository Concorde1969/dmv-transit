# Parking and park & ride, beyond Metrorail's own lots (those come from WMATA's API at
# every data refresh: see wmata_parking). Copied from each operator's own pages, checked
# on the date given; re-check `source` when an operator changes its lots or prices.
#
# [[lot]]
#   id         unique slug
#   operator   who runs the parking (shown to riders)
#   kind       station (a rail station's lot) | garage | airport
#   name       what riders see
#   stop       "feed:NAME PREFIX": placed at that feed's stop(s) whose name starts so
#   at         [lat, lon] instead of a stop (airports: the terminal, from airports.toml)
#   same_as    "wmata:CODE": the same lot as a Metrorail station's; folded into that one
#   available  false where the operator says there is no parking
#   spaces, cost, address, notes, options (airports: one entry per lot), source, checked

# --- Rules that apply across an operator's lots --------------------------------------

[rules.wmata]
source = "https://www.wmata.com/ride/guides/parking.html"
checked = "2026-11-16"
text = """Metro has parking at 51 stations. Daily (Park & Ride) parking is a flat fee for \
the day that varies by station, paid with SmarTrip, a contactless card or phone \
(tap the same card you rode with for the rider rate, and leave within two hours of \
starting your ride), or a credit card (a higher non-rider fee applies at 13 stations \
when the card is swiped). Parking is free for Metro riders on weekends and federal \
holidays, both hourly and daily. Kiss & Ride lots have hourly parking (pay stations or \
the ParkMobile app, which adds a service fee) and 15-minute pick-up spaces. Monthly \
reserved spaces at 40 stations cost $45 or $65 a month plus the daily rate; reserved \
spaces open to everyone after 10 am. Multi-day parking, up to 10 days, is allowed \
only at Greenbelt, Huntington, Franconia-Springfield and Wiehle-Reston East. Questions: \
parking@wmata.com or 202-GO-METRO (202-466-3876)."""

[rules.marc]
source = "https://www.mta.maryland.gov/marc-parking-details"
checked = "2026-11-16"
text = """Most MARC park and ride lots are free. Parking is limited and many lots fill \
before rush hour is over; Odenton, Point of Rocks and West Baltimore are among the \
first to fill. Lots run by WMATA (New Carrollton, Greenbelt, College Park, Rockville) \
follow WMATA's rules and fees."""

[rules.vre]
source = "https://www.vre.org/"
checked = "2026-11-16"
text = """Parking is free at most VRE stations, and cars can be left overnight in most \
lots (always at your own risk). There is no parking at Alexandria, Crystal City or \
L'Enfant. Union Station has a large parking garage for a fee. Franconia-Springfield \
uses Metro's parking facility (SmarTrip required; WMATA 202-637-7000). Parking at \
Quantico may require security checks. Manassas needs a permit. Fredericksburg has 644 \
free spaces in lots a few blocks from the station, some limited by residency."""

