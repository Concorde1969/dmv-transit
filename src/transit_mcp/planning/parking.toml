terminal garages. Economy lot capacity is reduced by about 40 percent during \
construction of a new parking structure; the airport suggests Metrorail if you don't \
have a reservation. Pay by credit card (swipe in and out), or take a ticket and pay \
at the exit (cash at attended lanes). Free shuttles run 24/7 between the terminals and \
all parking. 24-hour help: 703-417-4300."""
